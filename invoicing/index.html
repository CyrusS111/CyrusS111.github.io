<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F4E79">
<title>EL-SYS Invoicing</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<style>
:root {
  --brand: #1F4E79; --brand-2: #184F7B; --brand-soft: #e8eef5;
  --bg: #f4f6f9; --card: #ffffff; --text: #1d2733; --muted: #66727f; --line: #dde3ea;
  --ok: #1e7b4f; --ok-soft: #e3f3ea; --warn: #9a6200; --warn-soft: #fcf1dc; --bad: #b3261e; --bad-soft: #fbe5e3;
  --radius: 10px;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; line-height: 1.2; }
h2 { font-size: 20px; }
h3 { font-size: 16px; }
.hidden { display: none !important; }
.muted { color: var(--muted); }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* top bar */
header.top { background: var(--brand); color: #fff; position: sticky; top: 0; z-index: 10; }
.top-inner { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding: 10px 16px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: .2px; white-space: nowrap; }
@media (max-width: 900px) { .brand span { display: none; } }
.brand-logo { height: 46px; width: auto; display: block; flex: none; }
.brand span { border-left: 1px solid rgba(255,255,255,.35); padding-left: 12px; font-size: 17px; font-weight: 500; }
@media (max-width: 640px) { .brand-logo { height: 38px; } }
nav.tabs { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
nav.tabs button { background: transparent; border: 0; color: #dbe6f1; padding: 8px 12px; border-radius: 8px; cursor: pointer; }
nav.tabs button.active, nav.tabs button:hover { background: rgba(255,255,255,.14); color: #fff; }
.who { font-size: 13px; color: #cbd9e8; white-space: nowrap; }
.sync { background: transparent; border: 0; color: #cbd9e8; font-size: 12px; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; padding: 4px 6px; border-radius: 6px; }
.sync::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #6fd39b; }
.sync[data-state=saving]::before { background: #f2c94c; }
.sync[data-state=offline]::before { background: #b8c4d0; }
.sync[data-state=error]::before { background: #ff7b72; }
.sync:hover { background: rgba(255,255,255,.12); }
header.top .btn { background: transparent; border-color: rgba(255,255,255,.45); color: #fff; }
header.top .btn:hover { background: rgba(255,255,255,.14); }

main { max-width: 1180px; margin: 0 auto; padding: 20px 16px 60px; }
.view-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.view-head .spacer { flex: 1; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.grid { display: grid; gap: 16px; }
.kpis { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); margin-bottom: 16px; }
.kpi .label { font-size: 13px; color: var(--muted); }
.kpi .value { font-size: 24px; font-weight: 650; margin-top: 4px; font-variant-numeric: tabular-nums; }
.two { grid-template-columns: 1fr 1fr; }
@media (max-width: 820px) { .two { grid-template-columns: 1fr; } }

/* buttons & inputs */
.btn { border: 1px solid var(--line); background: #fff; padding: 8px 14px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: #b9c4d0; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.primary:hover { background: #193f62; }
.btn.danger { color: var(--bad); }
.btn.small { padding: 4px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
input, select, textarea { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: #fff; width: 100%; min-width: 0; }
input:focus, select:focus, textarea:focus { outline: 2px solid #9cb8d6; border-color: var(--brand); }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.search { max-width: 280px; }

/* tables */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 9px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); background: #fafbfc; font-weight: 600; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: #fafcff; }
td.actions { white-space: nowrap; text-align: right; }
td.actions .btn { margin-left: 4px; }
.empty { padding: 28px; text-align: center; color: var(--muted); }

.pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--brand-soft); color: var(--brand); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.grey { background: #eceff3; color: #56616d; }

/* invoice editor lines */
.lines td { padding: 6px; }
.lines input { padding: 6px 8px; }
.lines [data-k=item] { min-width: 190px; } .lines [data-k=specification] { min-width: 150px; }
.lines .tag { font-size: 11px; color: var(--muted); white-space: nowrap; margin-top: 2px; }
.lines .w-qty { width: 70px; } .lines .w-uom { width: 80px; } .lines .w-cost { width: 120px; }
.totals { margin-left: auto; max-width: 340px; width: 100%; }
.totals div { display: flex; justify-content: space-between; padding: 4px 0; }
.totals .grand { font-weight: 700; border-top: 1px solid var(--line); padding-top: 8px; margin-top: 4px; }

/* auth */
.auth { min-height: 100vh; display: grid; place-items: center; padding: 16px; background: linear-gradient(160deg, #1F4E79 0%, #16395a 100%); }
.auth .card { width: 100%; max-width: 400px; padding: 28px; }
.auth img { width: 72px; height: 72px; border-radius: 12px; display: block; margin: 0 auto 14px; }
.auth h1 { text-align: center; font-size: 20px; margin-bottom: 4px; }
.auth p.sub { text-align: center; margin: 0 0 18px; }
.auth form { display: grid; gap: 12px; }
.err { color: var(--bad); font-size: 14px; min-height: 1em; }

/* dialog */
dialog { border: 0; border-radius: 12px; padding: 0; width: min(560px, calc(100vw - 32px)); box-shadow: 0 20px 60px rgba(0,0,0,.25); }
dialog::backdrop { background: rgba(15, 30, 45, .45); }
dialog form { padding: 20px; display: grid; gap: 12px; }
dialog .row-end { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }

#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #1d2733; color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 100; max-width: calc(100vw - 32px); }
#toast.show { opacity: 1; }

@media (max-width: 640px) {
  .top-inner { flex-wrap: wrap; }
  .top-inner { padding: 8px 12px; row-gap: 6px; }
  nav.tabs { order: 3; width: 100%; margin-left: 0; overflow-x: auto; flex-wrap: nowrap; scrollbar-width: none; }
  nav.tabs button { padding: 6px 10px; }
  .who { margin-left: auto; }
  .hide-sm { display: none; }
  .search { max-width: none; }
}
</style>
</head>
<body>

<!-- First run / login -->
<section id="auth" class="auth hidden">
  <div class="card">
    <img src="assets/icon-192.png" alt="">
    <h1>EL-SYS Invoicing</h1>
    <p class="sub muted" id="auth-sub">Sign in to continue</p>

    <form id="connect-form" class="hidden" autocomplete="off">
      <label class="f">GitHub username<input name="owner" required autocapitalize="off" spellcheck="false"></label>
      <label class="f">Private repository name<input name="repo" value="elsys-data" required autocapitalize="off" spellcheck="false"></label>
      <label class="f">Access token (fine-grained, this repository only)<input name="token" type="password" required autocomplete="off" spellcheck="false"></label>
      <div class="err" id="connect-err"></div>
      <button class="btn primary" type="submit">Connect</button>
      <p class="muted" style="margin:4px 0 0;font-size:12px;text-align:center">The token is stored on this device locked with your app password. Your data is encrypted before it reaches GitHub.</p>
    </form>

    <form id="setup-form" class="hidden">
      <label class="f">Your username<input name="u" autocomplete="username" required></label>
      <label class="f">Password (at least 8 characters)<input name="p" type="password" minlength="8" autocomplete="new-password" required></label>
      <label class="f">Repeat password<input name="p2" type="password" minlength="8" autocomplete="new-password" required></label>
      <div class="err" id="setup-err"></div>
      <button class="btn primary" type="submit">Create account</button>
    </form>

    <form id="login-form" class="hidden">
      <label class="f">Username<input name="u" autocomplete="username" required></label>
      <label class="f">Password<input name="p" type="password" autocomplete="current-password" required></label>
      <label class="f hidden" id="login-token-wrap">GitHub access token<input name="token" type="password" autocomplete="off" spellcheck="false"></label>
      <div class="err" id="login-err"></div>
      <button class="btn primary" type="submit">Sign in</button>
      <p class="muted" style="margin:4px 0 0;font-size:12px;text-align:center">Data: <span id="login-repo"></span> · <a href="#" id="reconnect-link">change</a></p>
    </form>
  </div>
</section>
